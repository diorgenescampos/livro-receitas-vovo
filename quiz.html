<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Descubra seu Perfil Culinário | Caderno de Receitas da Vovó
</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>


<body>


<section class="quiz-page">

<div class="container">


<div class="quiz-content">


<span class="tag">
🍳 Quiz Culinário
</span>


<h1>
Descubra seu Perfil Culinário
</h1>


<p>
Responda algumas perguntas e descubra qual estilo de receitas combina mais com você.
</p>


<div class="quiz-box">
<div class="progresso">
    <div class="barra" id="barra"></div>
</div>

<p id="etapa">
Pergunta 1 de 3
</p>

<h2 id="pergunta">
Qual tipo de receita você mais gosta?
</h2>


<div class="quiz-options" id="opcoes">


<button onclick="responder('tradicional')">
🍲 Receitas de família
</button>


<button onclick="responder('doces')">
🍰 Bolos e sobremesas
</button>


<button onclick="responder('massas')">
🍞 Pães e massas caseiras
</button>


<button onclick="responder('praticas')">
🍪 Receitas simples e rápidas
</button>


</div>


<div id="resultado" style="display:none;">

<h2>
Seu perfil culinário:
</h2>

<p id="textoResultado"></p>


<a href="index.html#comprar" class="btn-primary">
Quero meu Caderno de Receitas
</a>


</div>


</div>


</div>


</div>


</section>


<script>

let etapa = 1;

let respostas = [];


function responder(resposta){

respostas.push(resposta);
atualizarProgresso();

if(etapa === 1){

etapa = 2;

document.getElementById("pergunta").innerHTML =
"Qual momento combina mais com você?";


document.getElementById("opcoes").innerHTML = `

<button onclick="responder('familia')">
👨‍👩‍👧 Reunir a família
</button>

<button onclick="responder('cafe')">
☕ Preparar um café especial
</button>

<button onclick="responder('memorias')">
❤️ Relembrar sabores antigos
</button>

<button onclick="responder('novidades')">
✨ Testar receitas novas
</button>

`;

}


else if(etapa === 2){

etapa = 3;


document.getElementById("pergunta").innerHTML =
"Qual ingrediente não pode faltar na sua cozinha?";


document.getElementById("opcoes").innerHTML = `

<button onclick="responder('farinha')">
🌾 Farinha e massas
</button>

<button onclick="responder('chocolate')">
🍫 Chocolate e doces
</button>

<button onclick="responder('temperos')">
🌿 Temperos especiais
</button>

<button onclick="responder('frutas')">
🍓 Frutas e receitas naturais
</button>

`;

}

else {

    mostrarResultado();

}

}


function atualizarProgresso(){

let barra = document.getElementById("barra");
let etapaTexto = document.getElementById("etapa");


if(etapa === 1){

    barra.style.width = "33%";
    etapaTexto.innerHTML = "Pergunta 1 de 3";

}


if(etapa === 2){

    barra.style.width = "66%";
    etapaTexto.innerHTML = "Pergunta 2 de 3";

}


if(etapa === 3){

    barra.style.width = "100%";
    etapaTexto.innerHTML = "Pergunta 3 de 3";

}

}

function mostrarResultado(){


document.getElementById("pergunta").style.display="none";

document.getElementById("opcoes").style.display="none";


let resultado =
"Você tem um perfil de amante da cozinha tradicional! ❤️ " +
"Seu estilo combina com receitas caseiras, sabores de infância e momentos especiais em família.";


document.getElementById("textoResultado").innerHTML = resultado;


document.getElementById("resultado").style.display="block";

}

</script>


</body>

</html>
